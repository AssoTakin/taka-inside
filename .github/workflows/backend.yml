name: Backend CI/CD — Railway

on:
  workflow_dispatch:
  push:
    branches: [master, main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    name: Build + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Strapi
        run: npm run build

  deploy-production:
    name: Deploy to Railway
    if: contains(fromJson('["refs/heads/main", "refs/heads/master"]'), github.ref)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          set -e
          DEPLOYMENT=$(curl -sS -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            https://backboard.railway.com/graphql/v2 \
            -d '{"query":"mutation { serviceInstanceDeployV2(serviceId: \"bceca45a-0fd3-42f4-9710-62a4df36b11c\", environmentId: \"1f8b5302-afa8-4746-aab9-a4db5cf0f8c0\") }"}')
          echo "$DEPLOYMENT"
          echo "$DEPLOYMENT" | grep -q 'serviceInstanceDeployV2' || exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Wait for Railway deployment to be healthy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" https://taka-inside-production.up.railway.app/api/site-config || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          exit 1
